name: create_tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: target version
        type: string
        required: false
        default: latest
  schedule:
    - cron: "0 14 * * *" # 23:00+09:00
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.1
      - name: Install dependencies
        run: |
          set -eux
          # A third-party apt repository of the runner image serving a broken
          # index must not stop a release, so ignore a failing update and let
          # installing the packages we need be the check.
          sudo apt-get update || true
          sudo apt-get install -y curl jq libarchive-tools
          bundle
      - name: Setup Git
        run: |
          set -eux
          git config --global user.name "Yuya Nishida"
          git config --global user.email "62389+nishidayuya@users.noreply.github.com"
      - name: Output versions
        run: |
          set -eux
          git --version
          bsdtar --version
          curl --version
          jq --version
          ruby --version
          gem --version
          bundle --version
          bundle list
      # A tag push means the build already happened in the run that created the
      # tag. Building again would update to the latest version and try to
      # re-create its existing tag, so only publish in that case.
      - name: Build + Create tag
        if: github.event_name != 'push'
        run: |
          set -eux
          if test "${VERSION:-latest}" = "latest"
          then
            export VERSION="$(bin/get_latest_upstream_release)"
          fi
          current_version="$(ruby -r./lib/pandoc_binary/version -e 'puts(PandocBinary::VERSION)')"
          if test "$VERSION" != "$current_version"
          then
            bundle exec ./bin/update_pandoc_binary "$VERSION"
            git add .
            git commit -m "feat: automatically update from $current_version to $VERSION"
            ./bin/test "$VERSION"
            bundle exec rake release:source_control_push
          fi
        env:
          VERSION: ${{github.event.inputs.version}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Publish to RubyGems
        run: |
          set -eux
          version="$(ruby -r./lib/pandoc_binary/version -e 'puts(PandocBinary::VERSION)')"
          if gem install -v "$version" pandoc_binary
          then
            echo 'Do not run "gem push" because that version is installable.'
          else
            gem build *.gemspec
            gem push *.gem
          fi
        env:
          GEM_HOST_API_KEY: ${{secrets.RUBYGEMS_AUTH_TOKEN}}
